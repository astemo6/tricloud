# 把 apk-build 分支里的 APK 发布到 Release v<版本>（与 iOS IPA 同一个 Release）。
# APK 在本地用固定签名打包后推到 apk-build 分支，再手动或经 API 触发本工作流。
name: Android APK release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch APK
        run: |
          git fetch -q origin apk-build
          mkdir -p out && git --work-tree=out checkout FETCH_HEAD -- .
          ls -la out
          V=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' ios/project.yml)
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "TriCloud $V" --notes-file .github/release-notes.md
          gh release edit "v$V" --notes-file .github/release-notes.md
          NEW=$(basename out/*.apk)
          for a in $(gh release view "v$V" --json assets -q '.assets[].name' | grep '\.apk$'); do
            [ "$a" = "$NEW" ] || gh release delete-asset "v$V" "$a" -y
          done
          gh release upload "v$V" out/*.apk --clobber

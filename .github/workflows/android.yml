# Android APK 自动构建：android/ 有改动推到 master 时自动构建，也可在 Actions 页手动运行。
# 打包方式与历史一致：assembleDebug + 固定 debug keystore（指纹 2308e396…），
# keystore 以 base64 存在仓库 Secret ANDROID_KEYSTORE_BASE64 里，构建时还原到 ~/.android/。
# 产物直接发到 Release v<版本>（与 iOS IPA 同一个 Release），替代原 apk-build 分支流程。
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KS_B64" | base64 -d > "$HOME/.android/debug.keystore"
      - name: Ensure Android SDK 34
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          fi
      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' ios/project.yml)
          B=$(awk -F'"' '/CURRENT_PROJECT_VERSION/{print $2; exit}' ios/project.yml)
          APK="TriCloud-$V-build$B.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          ls -la "$APK"
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "TriCloud $V" --notes-file .github/release-notes.md
          gh release edit "v$V" --notes-file .github/release-notes.md
          for a in $(gh release view "v$V" --json assets -q '.assets[].name' | grep '\.apk$'); do
            [ "$a" = "$APK" ] || gh release delete-asset "v$V" "$a" -y
          done
          gh release upload "v$V" "$APK" --clobber

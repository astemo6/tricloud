<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title data-i18n="login.docTitle">TriCloud 登录</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="card login" id="f">
    <h3 class="brand">Tri<span>Cloud</span> <span data-i18n="login.panel">面板</span></h3>
    <div class="muted" data-i18n="login.subtitle">OCI · AWS · Azure 三合一管理</div>
    <label data-i18n="login.password">面板密码</label>
    <div class="pw-wrap"><input type="password" class="pw-in" id="pw" autocomplete="current-password" autofocus required><button type="button" class="pw-eye" aria-label="显示密码" title="显示密码" onclick="var i=this.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';this.textContent=s?'🙈':'👁';var T=window.TCI18N;this.title=this.ariaLabel=T?(s?T.t('login.hidePw'):T.t('login.showPw')):(s?'隐藏密码':'显示密码');i.focus()">👁</button></div>
    <div id="otpBox" style="display:none"><label data-i18n="login.otpLabel">二次验证码（6 位）</label>
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="身份验证器 App 上的数字"></div>
    <div id="msg" class="muted" style="color:var(--bad);min-height:20px;margin-top:8px"></div>
    <button class="btn primary" style="width:100%" data-i18n="login.submit">登录</button>
    <div class="bar" style="margin-top:12px;justify-content:flex-end">
      <select id="theme" style="width:auto" data-i18n-title="theme.system">
        <option value="system" data-i18n="theme.system">跟随系统</option><option value="light" data-i18n="theme.light">浅色</option><option value="dark" data-i18n="theme.dark">深色</option>
      </select>
      <select id="lang" style="width:auto" data-i18n-title="lang.title">
        <option value="zh">中文</option><option value="en">English</option>
      </select>
    </div>
  </form>
</div>
<script type="module">
  import { getLang, setLang, applyI18n } from "/static/js/i18n.js";
  const lg = document.getElementById("lang");
  lg.value = getLang();
  lg.onchange = () => { setLang(lg.value); applyI18n(document); };
  applyI18n(document);
</script>
<script>
  var th = document.getElementById("theme");
  th.value = TCTheme.get();
  th.onchange = function () { TCTheme.set(th.value); };
  document.getElementById("f").onsubmit = async function (e) {
    e.preventDefault();
    var r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-Lang": (window.TCI18N ? window.TCI18N.getLang() : "zh") },
      body: JSON.stringify({ password: document.getElementById("pw").value, otp: document.getElementById("otp").value }) });
    if (r.ok) { location.href = "/" + (sessionStorage.getItem("tc_back") || ""); }
    else {
      var j = await r.json().catch(function () { return {}; });
      var TL = window.TCI18N; if (j.detail === "需要二次验证码" || (TL && j.detail === TL.t("login.otpDetail"))) { document.getElementById("otpBox").style.display = ""; document.getElementById("otp").focus(); var T = window.TCI18N; document.getElementById("msg").textContent = T ? T.t("login.needOtp") : "请输入二次验证码"; return; }
      var T = window.TCI18N; document.getElementById("msg").textContent = j.detail || (T ? T.t("login.fail") : "登录失败");
    }
  };
  // OTP input placeholder i18n
  var T = window.TCI18N; if (T) document.getElementById("otp").placeholder = T.t("login.otpPh");
</script>
</body>
</html>
